name: Update F1 Predictions

on:
  schedule:
    # Run every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
    - cron: '0 8 * * 4'

  # Allow manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-predictions:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jupyter nbconvert
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Run F1 predictions notebook
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute "fastf1_Predictions_final.ipynb" \
            --output executed.ipynb \
            --output-dir /tmp

      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/f1_predictions.json

          if git diff --cached --quiet; then
            echo "No changes to predictions."
          else
            git commit -m "Update F1 predictions"
            git push
          fi
